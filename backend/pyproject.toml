[project]
name = "mahjourney"
version = "0.1.0"
description = "Risk-aware multi-agent delivery dispatch system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=44,<46",
  "fastapi>=0.115,<1",
  "geoalchemy2>=0.17,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.4,<1",
  "numpy>=2.2,<3",
  "openai>=1.75,<3",
  "openpyxl>=3.1,<4",
  "ortools>=9.12,<10",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "coverage>=7.8,<8",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
